server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~ ^/(map|login|callback|access-denied|nodes|relations|sources|contexts|views|imports|pending|export)/?$ { try_files $uri /index.html; }
  location ~ ^/(imports/[A-Za-z0-9_-]+|edit/(nodes|relations|sources|contexts)(/[A-Za-z0-9_-]+)?|history/(nodes|relations)/[A-Za-z0-9_-]+)/?$ { try_files $uri /index.html; }
  location / { try_files $uri $uri/ =404; }
}
